# 四包统一的 CI：**typecheck → format:check → test**
#
# 顺序不是随意的：format 排在 test **之前**，所以一个纯缩进的错会让整个 workflow
# 在 20~40 秒就红掉，而本机 `pnpm gates` 是绿的（它不查格式）。2026-10-08 那轮
# 四个仓的 Release 全部栽在这上面，其中一处缩进错位来自更早的提交——
# 也就是说 main 上已经红了一段时间。所以这里把顺序钉死。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      # 三平台矩阵（V3-PLAN A6 / §8.3）。**「本地全绿」不等于「三平台全绿」**：
      # win32 上 chmod 只切只读位、路径分隔符不同、\\ 是 UNC 前缀、`npm` 是 `npm.cmd`——
      # 这些在 macOS 上一个都不会露出来，而它们每一个都曾让 v2 在 Windows 上装不上。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # 小程序 CI 打不开微信开发者工具，所以这里只跑那五道**不需要工具**的闸门。
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ⚠️ 这里**没有** `pnpm format:check`，与其他三个仓不同（2026-10-10 拆仓时发现）。
      #
      # 原来的写法是从"四包统一的 CI"模板抄过来的，但本包根本不具备这个能力：
      #   · `package.json` 里**没有** `format:check` 脚本，也**没有** prettier 依赖
      #     ⇒ 这一行在 CI 上是 `ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL: Command "format:check" not found`；
      #   · 就算把脚本补上，`.wxml` **没有 prettier parser**
      #     （`No parser could be inferred for file ".../sessions.wxml"`），
      #     另有 `.wxss` / `project.config.json` 等 11 个文件不合格式。
      #
      # ⇒ 要让这一行成立，得先补依赖 + 给 wxml 指定 parser（或忽略）+ 格式化那 11 个文件。
      #   那是一次**独立的、会动到大量小程序的**改动，不该混在拆仓里做。
      #   本包在小程序侧的格式保障由 `pnpm run check` 的八道闸负责（结构自检 / markdown /
      #   设计 token / 组件层 / 滚动策略 / 主题生成 / 对比度 / 共享文案表）。
      - run: pnpm run check